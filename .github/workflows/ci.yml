name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Test
        shell: pwsh
        run: ./scripts/Test-OrbitCord.ps1 -Configuration Release

      - name: Build framework-dependent package
        shell: pwsh
        run: ./scripts/Build-OrbitCord.ps1 -SkipTests
